name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: windows-latest, target: windows }
          - { os: macos-latest,   target: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: echo "VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - if: matrix.target == 'macos'
        run: brew install automake libtool  # libserialport pod builds from source
      - run: flutter build ${{ matrix.target }} --release --dart-define=APP_VERSION=$VERSION

      # Installers. Archived on the build host: upload-artifact drops symlinks and exec bits.
      - if: matrix.target == 'linux'
        run: |
          linux/package-deb.sh "$VERSION"
          tar czf CANtracer-linux-x64.tar.gz -C build/linux/x64/release bundle
      - if: matrix.target == 'windows'
        run: iscc "/DAppVersion=$VERSION" windows/installer.iss
      - if: matrix.target == 'macos'
        run: |
          mkdir dmg && cp -R build/macos/Build/Products/Release/CANtracer.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname CANtracer -srcfolder dmg -ov -format UDZO CANtracer-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CANtracer-${{ matrix.target }}
          path: CANtracer-*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      # Tag = pubspec version (build number stripped); skip if that release already exists.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" && { echo "$TAG exists, skipping"; exit 0; }
          gh release create "$TAG" CANtracer-* -R "$GITHUB_REPOSITORY" --generate-notes
